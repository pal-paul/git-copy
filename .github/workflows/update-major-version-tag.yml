name: Update Major Version Tag

on:
    release:
        types: [published]

jobs:
    update-major-tag:
        name: Point major tag to latest patch
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Update major tag alias
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                    echo "Skipping: '${RELEASE_TAG}' is not a semantic version tag (vX.Y.Z)."
                    exit 0
                  fi

                  major_tag="v${BASH_REMATCH[1]}"

                  git fetch --tags --force
                  target_sha=$(git rev-list -n 1 "${RELEASE_TAG}")

                  if [[ -z "${target_sha}" ]]; then
                    echo "Could not resolve release tag '${RELEASE_TAG}'."
                    exit 1
                  fi

                  echo "Updating ${major_tag} -> ${RELEASE_TAG} (${target_sha})"
                  git tag -f "${major_tag}" "${target_sha}"
                  git push origin "refs/tags/${major_tag}" --force
